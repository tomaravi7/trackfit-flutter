<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e0f46"/>
      <stop offset="100%" style="stop-color:#501e8c"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="rgba(180,130,255,0.3)" stroke-width="8"/>
  <g transform="translate(256,256)">
    <!-- Dumbbell bar -->
    <rect x="-140" y="-22" width="280" height="44" rx="10" fill="white"/>
    <!-- Left plate -->
    <ellipse cx="-175" cy="0" rx="45" ry="50" fill="white"/>
    <ellipse cx="-155" cy="0" rx="12" ry="50" fill="#1e0f46"/>
    <!-- Right plate -->
    <ellipse cx="175" cy="0" rx="45" ry="50" fill="white"/>
    <ellipse cx="155" cy="0" rx="12" ry="50" fill="#1e0f46"/>
    <!-- Heartbeat line -->
    <g transform="translate(0,-85)">
      <polyline points="-120,0 -40,0 0,-45 40,30 80,-20 120,0"
                fill="none" stroke="#ff6482" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
