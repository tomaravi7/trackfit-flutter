name: trackfit_flutter
description: A premium fitness, water, meals, and workout tracker with dual database support.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  shared_preferences: ^2.0.0
  sqflite: ^2.0.0
  postgres: ^3.0.0
  fl_chart: ^0.70.0
  path_provider: ^2.0.0
  intl: ^0.20.0
  path: any
  sqflite_common_ffi: any
  sqlite3_flutter_libs: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exercises.json
    - assets/foods.json
    - assets/logo.svg

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
